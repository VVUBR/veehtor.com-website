<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>AdCoach, Interactive Concept, Adcole Corporation</title>
<style>
  :root{
    --navy:#13334d; --navy-2:#1f5c86; --steel:#2e86c1; --ink:#1b2733;
    --line:#d9e2ea; --bg:#eef3f7; --panel:#ffffff; --muted:#6b7c8c;
    --ok:#1f9d6b; --warn:#c98a18; --soft:#f3f7fa;
    --shadow:0 1px 3px rgba(19,51,77,.08),0 8px 28px rgba(19,51,77,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 18px 60px}
  button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .ribbon{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);
    background:#fff8e8;border:1px solid #f1e2bd;border-radius:8px;padding:8px 12px;margin-bottom:16px}
  .ribbon b{color:#8a6b16}
  .app{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg,var(--navy),#0f2a40);color:#fff;padding:14px 18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--steel),#7fc4ec);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#08263b;font-size:17px;letter-spacing:.5px}
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand .sub{font-size:11.5px;color:#bcd6e8;margin-top:1px}
  .topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pill{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.25);
    color:#dbeaf5;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:transparent}
  button.pill{cursor:pointer;font-family:inherit}
  button.pill:hover{border-color:rgba(255,255,255,.6)}
  .dot{width:7px;height:7px;border-radius:50%;background:#46d29a;box-shadow:0 0 0 3px rgba(70,210,154,.18)}
  .dot.off{background:#e7b04a;box-shadow:0 0 0 3px rgba(231,176,74,.18)}
  select{font:inherit;font-size:11.5px;color:#08263b;border:0;border-radius:6px;padding:4px 8px;background:#dbeaf5;cursor:pointer}
  .subbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:9px 16px;background:#fff;border-bottom:1px solid var(--line)}
  .seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--muted);
    padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600}
  .seg button.on{background:var(--navy);color:#fff}
  .subhint{font-size:11.5px;color:var(--muted)}
  .stage{display:grid;grid-template-columns:1fr 268px;min-height:520px}
  @media(max-width:820px){.stage{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}}
  .chat{padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--soft);overflow:auto;max-height:540px}
  .row{display:flex;gap:10px;align-items:flex-start;max-width:90%}
  .row.user{align-self:flex-end;flex-direction:row-reverse}
  .av{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;background:var(--navy-2)}
  .av.u{background:#54657a}
  .bubble{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;box-shadow:0 1px 2px rgba(19,51,77,.05)}
  .row.user .bubble{background:var(--navy);color:#fff;border-color:var(--navy)}
  .bubble .lead{font-weight:600;margin-bottom:4px}
  .steps{margin:8px 0 2px;padding-left:18px;font-size:13.5px}
  .steps li{margin-bottom:3px}
  .note{margin-top:9px;font-size:11.5px;font-style:italic;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{font:inherit;font-size:13px;cursor:pointer;background:#fff;border:1px solid var(--steel);color:var(--navy-2);
    padding:8px 12px;border-radius:999px;transition:.12s;font-weight:500}
  .chip:hover{background:var(--steel);color:#fff}
  .chip.ghost{border-color:var(--line);color:var(--muted)}
  .chip.ghost:hover{background:#54657a;border-color:#54657a;color:#fff}
  .answer{border-left:3px solid var(--steel)}
  .conf{display:flex;align-items:center;gap:9px;margin:10px 0 6px}
  .bar{flex:1;height:7px;border-radius:99px;background:#e6edf3;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;width:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
  .conf .lab{font-size:11px;font-weight:700;letter-spacing:.3px}
  .cites{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
  .cites .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
  .src{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--soft);border:1px solid var(--line);
    border-radius:7px;padding:5px 9px;margin:0 6px 6px 0;color:var(--navy-2);cursor:pointer;font-family:inherit}
  .src:hover{border-color:var(--steel)}
  .excerpt{display:none;font-size:12px;color:var(--ink);background:#fbfdff;border:1px solid var(--line);
    border-left:3px solid var(--steel);border-radius:6px;padding:8px 10px;margin:0 0 8px}
  .flag{margin-top:9px;background:#fff8e8;border:1px solid #f1e2bd;border-radius:8px;padding:9px 11px;font-size:12.5px;color:#7a5e12}
  .captured{margin-top:9px;background:#eefaf3;border:1px solid #c2e8d3;border-radius:8px;padding:9px 11px;font-size:12.5px;color:#1c7a52}
  .offlinebox{margin-top:9px;font-size:12px;font-weight:600;color:var(--navy-2)}
  .form{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .form select{font-size:13px;color:var(--ink);background:var(--soft);border:1px solid var(--line);padding:8px 10px;border-radius:8px}
  .submitf{align-self:flex-start;margin-top:4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 16px}
  .typing .bubble{display:inline-flex;gap:4px;align-items:center;padding:13px}
  .typing span{width:6px;height:6px;border-radius:50%;background:#b6c4d0;animation:blink 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .side{border-left:1px solid var(--line);background:#fff;padding:16px}
  .side h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 10px}
  .kv{font-size:12.5px;margin-bottom:13px}
  .kv .t{color:var(--muted)}
  .kv .v{font-weight:600}
  .log{font-size:11.5px;color:var(--ink);border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
  .log span{color:var(--muted)}
wait}
  .restart{margin-top:14px;width:100%;font:inherit;font-size:12.5px;cursor:pointer;background:var(--soft);
    border:1px solid var(--line);color:var(--navy-2);padding:9px;border-radius:8px;font-weight:600}
  .restart:hover{background:#e3edf4}
  .composer{display:flex;gap:9px;align-items:center;border-top:1px solid var(--line);padding:12px 16px;background:#fff}
  .composer input{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--soft);color:var(--ink)}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--navy-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:#e3edf4}
  .send{border:0;background:var(--navy);color:#fff}
  .send:hover{background:#0f2a40}
  .toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(12px);
    background:#0f2a40;color:#fff;font-size:12.5px;padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;
    transition:.22s;box-shadow:var(--shadow);max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .vee{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--navy)}
  .vee i{width:18px;height:18px;border-radius:5px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-style:normal}
  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
